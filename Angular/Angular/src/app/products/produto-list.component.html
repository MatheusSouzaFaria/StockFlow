<div class="table-scroll"><table><thead><tr><th scope="col">Produto</th><th scope="col">Categoria</th><th scope="col">Saldo</th><th scope="col">Mínimo</th><th scope="col">Situação</th><th scope="col">Ações</th></tr></thead><tbody>
@for(p of produtos; track p.id){<tr><td><div class="product-cell"><span class="product-icon" aria-hidden="true">{{ p.nome.slice(0,2).toUpperCase() }}</span><div><strong>{{p.nome}}</strong><small>{{p.descricao || 'Sem descrição'}}</small></div></div></td><td>{{p.categoria}}</td><td class="numeric" [class.low-text]="baixo(p)">{{p.quantidade}}</td><td class="numeric">{{p.estoqueMinimo}}</td><td><span class="status" [class.low]="baixo(p)"><span class="dot"></span>{{baixo(p) ? 'Estoque baixo' : 'Normal'}}</span></td><td><div class="row-actions"><button class="btn small secondary" [disabled]="ocupado" (click)="editar.emit(p)" [attr.aria-label]="'Editar '+p.nome">Editar</button><button class="btn small danger-outline" [disabled]="ocupado" (click)="excluir.emit(p)" [attr.aria-label]="'Excluir '+p.nome">Excluir</button></div></td></tr>}
</tbody></table></div>
